[project]
name = "headwaters-backend"
version = "0.1.0"
description = "Headwaters — email threat detection and forensic intelligence platform"
requires-python = ">=3.12"

dependencies = [
    # --- web ---------------------------------------------------------------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",
    "python-multipart>=0.0.18",   # multipart/form-data (.eml upload)
    # --- config & logging --------------------------------------------------
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    # --- persistence -------------------------------------------------------
    # Sync SQLAlchemy + psycopg3 is deliberate; see docs/ARCHITECTURE.md
    # ("Why the data layer is synchronous").
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    # --- protocol verification ----------------------------------------------
    # DKIM is the only cryptographically re-verifiable element of email
    # authentication; dnspython resolves the selector key and the DMARC policy.
    "dkimpy>=1.1.8",
    "dnspython>=2.7.0",
    # Public Suffix List. The last-two-labels heuristic is wrong for co.uk,
    # com.au and several hundred other suffixes -- a real error, not a rounding
    # one, because DMARC alignment is computed on the organisational domain.
    "tldextract>=5.1.3",
    # MaxMind reader. Activates when a GeoLite2 .mmdb is present; the service
    # falls back to a bundled table and says which source answered.
    "geoip2>=4.8.0",
    # --- evidence integrity -------------------------------------------------
    "cryptography>=44.0.0",
    # --- reporting ----------------------------------------------------------
    "jinja2>=3.1.4",
    "weasyprint>=63.0",
    "pyyaml>=6.0.2",
    # --- outbound ----------------------------------------------------------
    "httpx>=0.28.0",
    "openai>=1.59.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    # starlette.testclient requires httpx2; the app itself uses httpx for
    # outbound calls, so both are present and that is intentional.
    "httpx2>=2.12.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S"]
# S101 (assert) is fine in tests; handled by per-file-ignores below.
ignore = ["S104"]  # binding 0.0.0.0 is correct inside a container

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

# Autogenerated by `alembic revision --autogenerate`. Reformatting them creates
# noisy diffs and risks editing DDL by hand; they are reviewed for correctness,
# not for style. The hand-written RLS migration is SQL-heavy by nature.
"alembic/versions/*" = [
    "E501",   # generated column definitions are long
    "I001",   # generated import order
    "F401",   # generated imports vary by what the diff touched
    "S608",   # f-string SQL over a module-level literal tuple, not user input
]

# `from sqlalchemy.dialects.postgresql import UUID as PgUUID` is the idiomatic
# alias for the dialect type; N811 reads it as a misnamed constant.
"app/models/*" = ["N811"]

# S105 flags `PASS = "pass"` in the SPF/DKIM/DMARC result vocabulary as a
# hardcoded password.
"app/models/enums.py" = ["N811", "S105"]

# RUF001 flags visually ambiguous characters. In these two modules that is the
# subject matter: the confusables table maps Cyrillic/Greek homoglyphs onto
# their ASCII lookalikes, and the whitespace pattern deliberately includes a
# non-breaking space because attackers use one to break naive tokenising.
"app/services/forensics/lookalike.py" = ["RUF001"]
"app/services/forensics/parser.py" = ["RUF001"]

# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# sentry-sdk is an OPTIONAL runtime dependency, imported lazily in
# app.main so a missing SDK can never prevent the service from starting.
[[tool.mypy.overrides]]
module = ["sentry_sdk.*"]
ignore_missing_imports = true

# Third-party packages that ship no type information.
[[tool.mypy.overrides]]
module = ["dkim.*", "tldextract.*", "geoip2.*", "dns.*", "weasyprint.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Third-party deprecations we do not control, scoped to the exact
    # message so our own deprecations still fail the build.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
